<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>외주 고객클레임 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f6;
    --grid-line: rgba(47,90,168,0.06);
    --surface: #ffffff;
    --surface-alt: #eaeef4;
    --border: #d9dee6;
    --ink: #171d27;
    --ink-dim: #5b6472;
    --ink-faint: #8b93a1;
    --accent: #2f5aa8;
    --accent-2: #1f8f7a;
    --accent-soft: #e7edf9;
    --accent-ink: #ffffff;
    --warn: #a5670c;
    --warn-soft: #f7ecd9;
    --danger: #b23a3a;
    --danger-soft: #f7e4e2;
    --focus: #2f5aa8;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(20,26,37,0.06), 0 8px 24px rgba(20,26,37,0.06);
    --tag-sat: 68%;
    --tag-bg-l: 93%;
    --tag-text-l: 32%;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10141b;
      --grid-line: rgba(111,150,222,0.07);
      --surface: #191f28;
      --surface-alt: #212834;
      --border: #2c3442;
      --ink: #e9ebf0;
      --ink-dim: #a3abb8;
      --ink-faint: #6d7683;
      --accent: #7ea2e6;
      --accent-2: #4bbfa4;
      --accent-soft: #1f2b42;
      --accent-ink: #0c111a;
      --warn: #dba746;
      --warn-soft: #35291a;
      --danger: #e08078;
      --danger-soft: #3a2320;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 26px rgba(0,0,0,0.3);
      --tag-sat: 55%;
      --tag-bg-l: 24%;
      --tag-text-l: 84%;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10141b;
    --grid-line: rgba(111,150,222,0.07);
    --surface: #191f28;
    --surface-alt: #212834;
    --border: #2c3442;
    --ink: #e9ebf0;
    --ink-dim: #a3abb8;
    --ink-faint: #6d7683;
    --accent: #7ea2e6;
    --accent-2: #4bbfa4;
    --accent-soft: #1f2b42;
    --accent-ink: #0c111a;
    --warn: #dba746;
    --warn-soft: #35291a;
    --danger: #e08078;
    --danger-soft: #3a2320;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 26px rgba(0,0,0,0.3);
    --tag-sat: 55%;
    --tag-bg-l: 24%;
    --tag-text-l: 84%;
  }

  * { box-sizing: border-box; }
  body {
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 28px),
      var(--bg);
    color: var(--ink);
    font-family: "Gowun Dodum", "Malgun Gothic", sans-serif;
    padding-inline: 20px;
    padding-block: 30px 60px;
    max-width: 1220px;
    margin: 0 auto;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .eyebrow::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 2px;
    background: var(--accent);
    display: inline-block;
    transform: rotate(45deg);
  }

  header.top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 18px;
  }
  header.top h1 {
    font-size: 1.65rem;
    font-weight: 700;
    margin: 0 0 5px;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  header.top p {
    margin: 0;
    color: var(--ink-dim);
    font-size: 0.9rem;
  }
  .vendor-switch {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 6px 5px 14px;
    box-shadow: var(--shadow);
  }
  .vendor-switch label {
    font-size: 0.78rem;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .vendor-switch select {
    border: none;
    background: var(--accent-soft);
    color: var(--ink);
    font: inherit;
    font-weight: 600;
    font-size: 0.86rem;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .vendor-switch select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .spectrum {
    height: 5px;
    border-radius: 999px;
    margin-bottom: 20px;
    display: flex;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .spectrum span { flex: 1; }

  .chiprow {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-dim);
    font: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 6px 12px 6px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .chip:hover { transform: translateY(-1px); border-color: var(--ink-faint); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--hue) var(--tag-sat) 50%); flex-shrink: 0; }
  .chip .count { font-family: "IBM Plex Mono", monospace; color: var(--ink-faint); }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
  }
  .chip[aria-pressed="true"] .count { color: var(--accent); }
  .chip.all[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip.all[aria-pressed="true"] .count { color: var(--accent-ink); }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .stat::before {
    content: "";
    position: absolute; inset: 0 auto 0 0;
    width: 3px;
    background: var(--stat-color, var(--accent));
  }
  .stat .head { display: flex; align-items: center; gap: 6px; color: var(--ink-faint); }
  .stat .head svg { width: 14px; height: 14px; }
  .stat .num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 1.7rem;
    font-weight: 500;
    line-height: 1.3;
  }
  .stat .label {
    color: var(--ink-dim);
    font-size: 0.78rem;
    margin-top: 2px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .toolbar input[type="search"], .toolbar select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    font: inherit;
    font-size: 0.86rem;
    padding: 9px 12px;
    border-radius: 8px;
  }
  .toolbar input[type="search"] { flex: 1 1 220px; }
  .toolbar input[type="search"]:focus-visible, .toolbar select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  thead th {
    text-align: left;
    font-size: 0.71rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: var(--surface-alt);
    padding: 11px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr { animation: rowIn 0.28s ease both; }
  tbody tr:nth-child(n+2) { animation-delay: calc(var(--i, 0) * 18ms); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { tbody tr { animation: none; } }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-alt); }
  td.defect { max-width: 260px; }
  td.source .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: hsl(var(--hue) var(--tag-sat) var(--tag-bg-l));
    color: hsl(var(--hue) var(--tag-sat) var(--tag-text-l));
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }
  td.source .tag::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: hsl(var(--hue) var(--tag-sat) 45%);
  }

  .thumb {
    width: 56px; height: 56px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    cursor: pointer;
    padding: 0;
    transition: transform 0.12s ease;
  }
  .thumb:hover { transform: scale(1.05); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb svg { width: 22px; height: 22px; color: var(--ink-faint); }

  .empty {
    padding: 52px 20px;
    text-align: center;
    color: var(--ink-dim);
  }
  .empty svg { width: 40px; height: 40px; color: var(--ink-faint); margin-bottom: 10px; }

  footer.note {
    margin-top: 18px;
    color: var(--ink-faint);
    font-size: 0.78rem;
    text-align: center;
  }

  .lightbox {
    position: fixed; inset: 0;
    background: rgba(8,10,14,0.72);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    z-index: 50;
  }
  .lightbox[hidden] { display: none; }
  .lightbox .box {
    background: var(--surface);
    border-radius: var(--radius);
    max-width: min(560px, 100%);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .lightbox img { width: 100%; display: block; max-height: 60vh; object-fit: contain; background: var(--surface-alt); }
  .lightbox .cap { padding: 14px 16px; font-size: 0.85rem; }
  .lightbox .cap .defecttxt { color: var(--ink-dim); margin-top: 4px; }
  .lightbox button.close {
    position: absolute; top: 34px; right: 34px;
    background: var(--surface); border: 1px solid var(--border);
    width: 34px; height: 34px; border-radius: 50%;
    font-size: 1.1rem; cursor: pointer; color: var(--ink);
  }

  @media (max-width: 720px) {
    .panel table, .panel thead, .panel tbody, .panel th, .panel td, .panel tr { display: block; }
    thead { display: none; }
    tbody tr {
      border-bottom: 8px solid var(--bg);
      padding: 12px 14px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 12px;
    }
    tbody td {
      border: none;
      padding: 3px 0;
      display: grid;
      grid-template-columns: subgrid;
      grid-column: 1 / -1;
    }
    tbody td::before {
      content: attr(data-label);
      color: var(--ink-faint);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding-top: 2px;
    }
    td.imgcell { justify-self: start; }
  }

  /* --- brand bar / logo --- */
  .brandbar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }
  header.top { align-items: center; }
  .actions-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    font: inherit;
    font-weight: 600;
    font-size: 0.86rem;
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .btn-primary svg { width: 16px; height: 16px; }

  /* --- modal / form --- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(8,10,14,0.55);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
    z-index: 60;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    width: min(640px, 100%);
    padding: 24px;
  }
  .modal-card h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .modal-card .modal-sub { margin: 0 0 18px; color: var(--ink-dim); font-size: 0.85rem; }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 14px;
    margin-bottom: 14px;
  }
  .form-grid .full { grid-column: 1 / -1; }
  .field label {
    display: block;
    font-size: 0.76rem;
    color: var(--ink-dim);
    margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--ink);
    font: inherit;
    font-size: 0.86rem;
    padding: 9px 10px;
    border-radius: 8px;
  }
  .field textarea { resize: vertical; min-height: 54px; }
  .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 1px;
  }

  .dropzone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 22px 16px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
    margin-bottom: 12px;
  }
  .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .dropzone svg { width: 26px; height: 26px; color: var(--ink-faint); margin-bottom: 6px; }
  .dropzone strong { color: var(--accent); }

  .filechips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .filechip {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.78rem;
    max-width: 220px;
  }
  .filechip img { width: 30px; height: 30px; border-radius: 5px; object-fit: cover; flex-shrink: 0; }
  .filechip .pdfmark {
    width: 30px; height: 30px; border-radius: 5px; flex-shrink: 0;
    background: var(--danger-soft); color: var(--danger);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.62rem; font-weight: 700;
  }
  .filechip .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filechip button {
    border: none; background: none; color: var(--ink-faint); cursor: pointer;
    font-size: 0.9rem; line-height: 1; padding: 2px;
  }

  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .btn-ghost {
    background: none; border: 1px solid var(--border); color: var(--ink-dim);
    font: inherit; font-size: 0.86rem; padding: 9px 16px; border-radius: 999px; cursor: pointer;
  }

  /* --- pending queue --- */
  .pending-banner {
    background: var(--warn-soft);
    border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .pending-banner[hidden] { display: none; }
  .pending-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .pending-head strong { color: var(--warn); font-size: 0.88rem; }
  .pending-head p { margin: 3px 0 0; font-size: 0.78rem; color: var(--ink-dim); }
  .pending-list { display: flex; flex-direction: column; gap: 8px; }
  .pending-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 0.82rem;
  }
  .pending-item .meta { color: var(--ink-dim); font-size: 0.76rem; }
  .pending-item .row-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .pending-item button {
    border: 1px solid var(--border); background: var(--surface-alt); color: var(--ink);
    font: inherit; font-size: 0.75rem; padding: 5px 9px; border-radius: 6px; cursor: pointer;
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    padding: 11px 20px; border-radius: 999px;
    font-size: 0.86rem; font-weight: 500;
    box-shadow: var(--shadow);
    z-index: 80;
  }
  .toast[hidden] { display: none; }
  .toast.error { background: var(--danger); color: #fff; }

  .imgcount {
    position: absolute; bottom: -3px; right: -3px;
    background: var(--accent); color: var(--accent-ink);
    font-size: 0.62rem; font-weight: 700;
    border-radius: 999px; padding: 1px 5px;
    line-height: 1.3;
  }
  .thumb { position: relative; }
  .pdflink {
    width: 56px; height: 56px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--danger-soft); color: var(--danger);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; font-weight: 700; text-decoration: none;
  }

  .status-pill {
    border: 1px solid var(--pill-color, var(--border));
    background: color-mix(in srgb, var(--pill-color, var(--ink-faint)) 14%, var(--surface));
    color: var(--pill-color, var(--ink));
    font: inherit; font-weight: 600; font-size: 0.78rem;
    padding: 5px 10px; border-radius: 999px; cursor: pointer;
  }
  .manage-cell { display: flex; gap: 6px; }
  .manage-btn {
    border: 1px solid var(--border); background: var(--surface-alt); color: var(--ink);
    font: inherit; font-size: 0.76rem; font-weight: 600;
    padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .manage-btn:hover { border-color: var(--accent); color: var(--accent); }
  .manage-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>

<div class="brandbar">
  <div>
    <span class="eyebrow">협력사 품질관리</span>
    <h1 style="margin:2px 0 0;font-size:1.3rem;">외주 고객클레임 관리</h1>
  </div>
</div>

<header class="top">
  <div>
    <p id="subtitle">업체를 선택하면 해당 업체 관련 항목만 표시됩니다.</p>
  </div>
  <div class="actions-right">
    <div class="vendor-switch">
      <label for="vendorSelect">보기</label>
      <select id="vendorSelect"></select>
    </div>
    <button type="button" class="btn-primary" id="openRegister">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      클레임 등록
    </button>
  </div>
</header>

<div class="spectrum" id="spectrum"></div>

<div class="chiprow" id="chipRow"></div>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <input type="search" id="searchBox" placeholder="제품코드, 하자내역, 브랜드로 검색">
  <select id="brandFilter"></select>
</div>

<div class="panel">
  <table id="dataTable">
    <thead>
      <tr>
        <th>처리상태</th>
        <th>발생일</th>
        <th>구분</th>
        <th>유형</th>
        <th>브랜드</th>
        <th>원인처</th>
        <th>제품코드</th>
        <th>색상</th>
        <th>LOT NO</th>
        <th>공급</th>
        <th>하자내역</th>
        <th>사진/PDF</th>
        <th>관리</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="emptyState" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6M12 3v18M3 12h.01M21 12h.01" stroke-linecap="round"/></svg>
    <div>해당 업체의 등록된 클레임이 아직 없습니다.</div>
  </div>
</div>


<div class="lightbox" id="lightbox" hidden>

  <div class="box">

    <div class="cap">

  <div class="modal-card">

    <p class="modal-sub">저장하면 대시보드를 보는 모든 사람에게 바로 반영됩니다.</p>
    <form id="registerForm">
      <div class="form-grid">
        <div class="field">
          <label for="fCategory">구분</label>
          <input id="fCategory" type="text" placeholder="예: 고객불만" required>

        <div class="field">
          <label for="fType">유형</label>
          <input id="fType" type="text" placeholder="예: 자재">

          <label for="fBrand">브랜드</label>
          <select id="fBrand"></select>

          <label for="fColor">색상</label>
          <input id="fColor" type="text" placeholder="예: WW">
        </div>
        <div class="field">
          <label for="fLot">LOT NO</label>
          <input id="fLot" type="text" placeholder="예: 2026.08.27 J">
        </div>
        <div class="field">
          <label for="fSupply">공급</label>
          <input id="fSupply" type="text" placeholder="예: (벽고정)_정찬숙(차)">
        </div>
        <div class="field">
          <label for="fStatus">처리상태</label>
          <select id="fStatus"></select>
        </div>
        <div class="field">
          <label for="fOccurred">발생일</label>
          <input id="fOccurred" type="date">
        </div>
        <div class="field full">
          <label for="fDefect">하자내역</label>
          <textarea id="fDefect" placeholder="하자 내용을 적어주세요"></textarea>
        </div>
      </div>

      <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="사진 또는 PDF 첨부">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V4M12 4l-4 4M12 4l4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><strong>클릭</strong>하거나 사진/PDF 파일을 여기로 <strong>드래그</strong>해서 첨부하세요</div>
        <input type="file" id="fileInput" accept="image/*,application/pdf" multiple hidden>
      </div>
      <div class="filechips" id="fileChips"></div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelRegister">취소</button>
        <button type="submit" class="btn-primary" id="submitRegister">저장</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
  // 업체 목록(가나다 순) — 새 업체가 생기면 여기에 추가하고 아래 VENDOR_HUE에도 색을 지정해 주세요
  const VENDORS = ["가온", "금용", "송아", "에픽", "엘에스에프", "올품", "유진", "정운", "제일", "진산"];

  // 업체별 고유 색상(hue, 0-360) — 표와 칩에서 업체를 한눈에 구분하기 위한 값
  const VENDOR_HUE = {
    "가온": 8, "금용": 44, "송아": 80, "에픽": 152, "엘에스에프": 188,
    "올품": 224, "유진": 260, "정운": 296, "제일": 332, "진산": 116
  };
  function hueOf(vendor) { return VENDOR_HUE[vendor] ?? 210; }

  // 브랜드 목록 — 새 브랜드가 생기면 여기에 추가
  const BRANDS = ["퍼시스", "일룸", "데스커", "시디즈", "알로소", "슬로우베드"];

  // 클레임 데이터 — Firebase 실시간 데이터베이스에서 불러옵니다 (아래 Firebase 섹션 참고)
  let CLAIMS = [];
  const SEED_CLAIM = {
    category: "고객불만",
    type: "자재",
    brand: "일룸",
    vendor: "제일",
    source: "외주(제일)",
    code: "IHS14CP06A",
    color: "WW",
    lotOn: "2026.08.27 J",
    supply: "(벽고정)_정찬숙(차)",
    defect: "전선캡 커버 누락",
    images: [],
    status: "진행중",
    occurredAt: "2026-08-27",
    createdAt: new Date().toISOString()
  };
  const STATUS_LIST = ["진행중", "지연", "완료"];
  const STATUS_COLOR = { "진행중": "var(--warn)", "지연": "var(--danger)", "완료": "var(--accent-2)" };

  const vendorSelect = document.getElementById('vendorSelect');
  const brandFilter = document.getElementById('brandFilter');
  const searchBox = document.getElementById('searchBox');
  const tbody = document.getElementById('tbody');
  const emptyState = document.getElementById('emptyState');
  const statsEl = document.getElementById('stats');
  const subtitle = document.getElementById('subtitle');
  const chipRow = document.getElementById('chipRow');
  const spectrum = document.getElementById('spectrum');

  function loadVendor() {
    try { return localStorage.getItem('claim_dashboard_vendor') || '__ALL__'; } catch (e) { return '__ALL__'; }
  }
  function saveVendor(v) {
    try { localStorage.setItem('claim_dashboard_vendor', v); } catch (e) {}
  }

  function buildSpectrum() {
    spectrum.innerHTML = VENDORS.map(v => `<span style="background:hsl(${hueOf(v)} var(--tag-sat) 52%)"></span>`).join('');
  }

  function buildVendorOptions() {
    vendorSelect.innerHTML = '';
    vendorSelect.add(new Option('전체보기 (사내)', '__ALL__'));
    VENDORS.forEach(v => vendorSelect.add(new Option(v, v)));
    vendorSelect.value = VENDORS.includes(loadVendor()) ? loadVendor() : '__ALL__';
  }

  function buildBrandOptions() {
    brandFilter.innerHTML = '';
    brandFilter.add(new Option('전체 브랜드', ''));
    BRANDS.forEach(b => brandFilter.add(new Option(b, b)));
  }

  // ---------- Firebase (실시간 공유 저장소) ----------
  // claim-dashboard 프로젝트와 같은 Firebase 프로젝트를 재사용하되, 이 대시보드 전용 경로만 씁니다.
  const firebaseConfig = {
    apiKey: "AIzaSyD3nS7b5hGJKXDeeuT50C9xlxenTceCASk",
    authDomain: "experiment-dashboard-50db5.firebaseapp.com",
    databaseURL: "https://experiment-dashboard-50db5-default-rtdb.firebaseio.com",
    projectId: "experiment-dashboard-50db5",
    storageBucket: "experiment-dashboard-50db5.firebasestorage.app",
    messagingSenderId: "807748487712",
    appId: "1:807748487712:web:bbb10a9f35564da1a88a45"
  };
  firebase.initializeApp(firebaseConfig);
  const fbDb = firebase.database();
  const CLAIMS_PATH = 'outsourcing_claims/claims';
  const MAX_FILE_BYTES = 1.5 * 1024 * 1024; // 결제 없는 무료 DB 저장이라 파일당 용량을 제한합니다

  let fbReady = false;
  fbDb.ref(CLAIMS_PATH).on('value', snap => {
    const val = snap.val();
    if (!val) {
      if (!fbReady) { fbDb.ref(CLAIMS_PATH).push(SEED_CLAIM); }
      fbReady = true;
      return;
    }
    fbReady = true;
    CLAIMS = Object.keys(val).map(id => ({ id, ...val[id] }));
    render();
  }, err => {
    console.error('Firebase 연결 실패', err);
    showToast('실시간 데이터를 불러오지 못했어요. 새로고침해 보세요.', true);
  });

  function showToast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.hidden = false;
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => { t.hidden = true; }, 3200);
  }

  // ---------- 클레임 등록 ----------
  const registerModal = document.getElementById('registerModal');
  const openRegisterBtn = document.getElementById('openRegister');
  const cancelRegisterBtn = document.getElementById('cancelRegister');
  const registerForm = document.getElementById('registerForm');
  const submitBtn = document.getElementById('submitRegister');
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const fileChipsEl = document.getElementById('fileChips');
  const fBrand = document.getElementById('fBrand');
  const fVendor = document.getElementById('fVendor');

  let pendingFiles = [];

  const fStatus = document.getElementById('fStatus');
  function fillModalSelects() {
    fBrand.innerHTML = '';
    BRANDS.forEach(b => fBrand.add(new Option(b, b)));
    fVendor.innerHTML = '';
    VENDORS.forEach(v => fVendor.add(new Option(v, v)));
    fStatus.innerHTML = '';
    STATUS_LIST.forEach(s => fStatus.add(new Option(s, s)));
  }

  let editingId = null;
  let editingCreatedAt = null;

  function openModal(claim) {
    fillModalSelects();
    registerForm.reset();
    if (claim) {
      editingId = claim.id;
      editingCreatedAt = claim.createdAt || new Date().toISOString();
      document.getElementById('modalTitle').textContent = '클레임 수정';
      document.getElementById('fCategory').value = claim.category || '';
      document.getElementById('fType').value = claim.type || '';
      fBrand.value = claim.brand || BRANDS[0];
      fVendor.value = claim.vendor || VENDORS[0];
      document.getElementById('fCode').value = claim.code || '';
      document.getElementById('fColor').value = claim.color || '';
      document.getElementById('fLot').value = claim.lotOn || '';
      document.getElementById('fSupply').value = claim.supply || '';
      fStatus.value = claim.status || '진행중';
      document.getElementById('fOccurred').value = claim.occurredAt || '';
      document.getElementById('fDefect').value = claim.defect || '';
      pendingFiles = (claim.images || []).map(img => ({
        name: img.name, type: img.type, dataUrl: img.url, thumb: img.type === 'image' ? img.url : null
      }));
    } else {
      editingId = null;
      editingCreatedAt = null;
      document.getElementById('modalTitle').textContent = '클레임 등록';
      document.getElementById('fOccurred').value = new Date().toISOString().slice(0, 10);
      pendingFiles = [];
    }
    renderFileChips();
    registerModal.hidden = false;
  }
  function closeModal() { registerModal.hidden = true; }

  openRegisterBtn.addEventListener('click', () => openModal());
  cancelRegisterBtn.addEventListener('click', closeModal);
  registerModal.addEventListener('click', e => { if (e.target === registerModal) closeModal(); });

  function resizeImage(file, maxDim, quality) {
    return new Promise(resolve => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = e => { img.src = e.target.result; };
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      reader.readAsDataURL(file);
    });
  }

  function readAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function addFiles(fileList) {
    for (const file of Array.from(fileList)) {
      if (file.type === 'application/pdf') {
        if (file.size > MAX_FILE_BYTES) {
          showToast(`"${file.name}" 파일이 너무 커요 (1.5MB 이하만 첨부 가능).`, true);
          continue;
        }
        const dataUrl = await readAsDataUrl(file);
        pendingFiles.push({ name: file.name, size: file.size, type: 'pdf', thumb: null, dataUrl });
      } else if (file.type.startsWith('image/')) {
        const dataUrl = await resizeImage(file, 640, 0.72);
        pendingFiles.push({ name: file.name, size: file.size, type: 'image', thumb: dataUrl, dataUrl });
      }
    }
    renderFileChips();
  }

  function renderFileChips() {
    fileChipsEl.innerHTML = pendingFiles.map((f, i) => `
      <span class="filechip">
        ${f.type === 'image' ? `<img src="${f.thumb}" alt="">` : `<span class="pdfmark">PDF</span>`}
        <span class="fname">${escapeHtml(f.name)}</span>
        <button type="button" data-i="${i}" aria-label="첨부 제거">✕</button>
      </span>
    `).join('');
    fileChipsEl.querySelectorAll('button[data-i]').forEach(btn => {
      btn.addEventListener('click', () => { pendingFiles.splice(Number(btn.dataset.i), 1); renderFileChips(); });
    });
  }

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
  fileInput.addEventListener('change', () => addFiles(fileInput.files));
  ['dragover', 'dragenter'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone.addEventListener('drop', e => { if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files); });

  registerForm.addEventListener('submit', async e => {
    e.preventDefault();
    const vendor = fVendor.value;
    submitBtn.disabled = true;
    submitBtn.textContent = '저장 중...';
    try {
      const images = pendingFiles.map(pf => ({ url: pf.dataUrl, name: pf.name, type: pf.type }));
      const entry = {
        category: document.getElementById('fCategory').value.trim(),
        type: document.getElementById('fType').value.trim(),
        brand: fBrand.value,
        vendor,
        source: `외주(${vendor})`,
        code: document.getElementById('fCode').value.trim(),
        color: document.getElementById('fColor').value.trim(),
        lotOn: document.getElementById('fLot').value.trim(),
        supply: document.getElementById('fSupply').value.trim(),
        status: fStatus.value,
        occurredAt: document.getElementById('fOccurred').value,
        defect: document.getElementById('fDefect').value.trim(),
        images,
        createdAt: editingId ? editingCreatedAt : new Date().toISOString()
      };
      if (editingId) {
        await fbDb.ref(`${CLAIMS_PATH}/${editingId}`).set(entry);
        showToast('수정했어요. 모두에게 바로 반영됐어요.');
      } else {
        await fbDb.ref(CLAIMS_PATH).push(entry);
        showToast('등록 완료! 모두에게 바로 반영됐어요.');
      }
      closeModal();
    } catch (err) {
      console.error(err);
      showToast('저장에 실패했어요. 담당자에게 문의해 주세요. (' + (err?.code || err?.message || '알 수 없는 오류') + ')', true);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '저장';
    }
  });

  function setVendor(v) {
    vendorSelect.value = v;
    saveVendor(v);
    render();
  }

  function buildChips() {
    const counts = {};
    CLAIMS.forEach(c => { counts[c.vendor] = (counts[c.vendor] || 0) + 1; });
    const current = vendorSelect.value;
    const allChip = `<button class="chip all" data-v="__ALL__" aria-pressed="${current === '__ALL__'}">전체<span class="count">${CLAIMS.length}</span></button>`;
    const chips = VENDORS.map(v => `
      <button class="chip" data-v="${v}" aria-pressed="${current === v}" style="--hue:${hueOf(v)}">
        <span class="dot"></span>${v}<span class="count">${counts[v] || 0}</span>
      </button>
    `).join('');
    chipRow.innerHTML = allChip + chips;
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function placeholderThumb() {
    return '<span class="thumb" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  }

  function imageCell(c) {
    const images = c.images || [];
    if (images.length === 0) return placeholderThumb();
    const firstImg = images.find(f => f.type === 'image');
    if (firstImg) {
      const extra = images.length > 1 ? `<span class="imgcount">+${images.length - 1}</span>` : '';
      return `<button class="thumb" data-id="${c.id}"><img src="${escapeHtml(firstImg.url)}" alt="${escapeHtml(c.defect)} 사진">${extra}</button>`;
    }
    const pdf = images[0];
    return `<a class="pdflink" href="${escapeHtml(pdf.url)}" target="_blank" rel="noopener">PDF</a>`;
  }

  function statusCell(c) {
    const status = c.status || '진행중';
    const color = STATUS_COLOR[status] || 'var(--ink-faint)';
    const opts = STATUS_LIST.map(s => `<option value="${s}" ${s === status ? 'selected' : ''}>${s}</option>`).join('');
    return `<select class="status-pill" data-status-id="${c.id}" style="--pill-color:${color}">${opts}</select>`;
  }

  function render() {
    const vendor = vendorSelect.value;
    const brand = brandFilter.value;
    const q = searchBox.value.trim().toLowerCase();

    subtitle.textContent = vendor === '__ALL__'
      ? '전체 업체의 클레임 항목을 보고 있습니다.'
      : `"${vendor}" 업체 관련 클레임 항목만 표시 중입니다.`;

    let rows = CLAIMS.filter(c => vendor === '__ALL__' || c.vendor === vendor);
    if (brand) rows = rows.filter(c => c.brand === brand);
    if (q) {
      rows = rows.filter(c =>
        [c.code, c.defect, c.brand, c.category, c.type, c.source].some(f => String(f ?? '').toLowerCase().includes(q))
      );
    }

    tbody.innerHTML = rows.map((c, i) => `
      <tr style="--i:${i}">
        <td data-label="처리상태">${statusCell(c)}</td>
        <td data-label="발생일" class="mono">${escapeHtml(c.occurredAt)}</td>
        <td data-label="구분">${escapeHtml(c.category)}</td>
        <td data-label="유형">${escapeHtml(c.type)}</td>
        <td data-label="브랜드">${escapeHtml(c.brand)}</td>
        <td data-label="원인처" class="source"><span class="tag" style="--hue:${hueOf(c.vendor)}">${escapeHtml(c.source)}</span></td>
        <td data-label="제품코드" class="mono">${escapeHtml(c.code)}</td>
        <td data-label="색상" class="mono">${escapeHtml(c.color)}</td>
        <td data-label="LOT NO" class="mono">${escapeHtml(c.lotOn)}</td>
        <td data-label="공급">${escapeHtml(c.supply)}</td>
        <td data-label="하자내역" class="defect">${escapeHtml(c.defect)}</td>
        <td data-label="사진/PDF" class="imgcell">${imageCell(c)}</td>
        <td data-label="관리" class="manage-cell">
          <button type="button" class="manage-btn" data-edit-id="${c.id}">수정</button>
          <button type="button" class="manage-btn danger" data-del-id="${c.id}">삭제</button>
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('select[data-status-id]').forEach(sel => {
      sel.addEventListener('change', () => {
        fbDb.ref(`${CLAIMS_PATH}/${sel.dataset.statusId}/status`).set(sel.value)
          .catch(err => showToast('상태 변경 실패: ' + (err?.message || ''), true));
      });
    });
    tbody.querySelectorAll('button[data-del-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!confirm('이 클레임 항목을 삭제할까요? 되돌릴 수 없어요.')) return;
        fbDb.ref(`${CLAIMS_PATH}/${btn.dataset.delId}`).remove()
          .then(() => showToast('삭제했어요.'))
          .catch(err => showToast('삭제 실패: ' + (err?.message || ''), true));
      });
    });
    tbody.querySelectorAll('button[data-edit-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const c = CLAIMS.find(x => String(x.id) === btn.dataset.editId);
        if (c) openModal(c);
      });
    });

    emptyState.hidden = rows.length !== 0;
    document.getElementById('dataTable').style.display = rows.length === 0 ? 'none' : '';

    const inProgress = rows.filter(r => (r.status || '진행중') === '진행중').length;
    const delayed = rows.filter(r => r.status === '지연').length;
    const done = rows.filter(r => r.status === '완료').length;
    const doneRate = rows.length ? Math.round((done / rows.length) * 100) : 0;
    statsEl.innerHTML = `
      <div class="stat" style="--stat-color:var(--accent)">
        <div class="head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>전체 클레임</div>
        <div class="num mono">${rows.length}</div>
        <div class="label">누적 등록 건수</div>
      </div>
      <div class="stat" style="--stat-color:var(--warn)">
        <div class="head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2" stroke-linecap="round"/></svg>진행중</div>
        <div class="num mono">${inProgress}</div>
        <div class="label">개선대책서 작성 중</div>
      </div>
      <div class="stat" style="--stat-color:var(--danger)">
        <div class="head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 9v4M12 17h.01" stroke-linecap="round"/><circle cx="12" cy="12" r="8.5"/></svg>지연</div>
        <div class="num mono">${delayed}</div>
        <div class="label">지연으로 표시된 건</div>
      </div>
      <div class="stat" style="--stat-color:var(--accent-2)">
        <div class="head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>완료율</div>
        <div class="num mono">${doneRate}%</div>
        <div class="label">개선대책서 작성 완료 기준</div>
      </div>
    `;

    buildChips();
  }

  tbody.addEventListener('click', e => {
    const btn = e.target.closest('button.thumb[data-id]');
    if (!btn) return;
    const c = CLAIMS.find(x => String(x.id) === btn.dataset.id);
    const firstImg = (c?.images || []).find(f => f.type === 'image');
    if (!firstImg) return;
    document.getElementById('lightboxImg').src = firstImg.url;
    document.getElementById('lightboxCode').textContent = `${c.code} / ${c.color}`;
    document.getElementById('lightboxDefect').textContent = c.defect;
    document.getElementById('lightbox').hidden = false;
  });
  document.getElementById('lightboxClose').addEventListener('click', () => {
    document.getElementById('lightbox').hidden = true;
  });
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target.id === 'lightbox') e.target.hidden = true;
  });

  chipRow.addEventListener('click', e => {
    const btn = e.target.closest('button.chip[data-v]');
    if (!btn) return;
    setVendor(btn.dataset.v);
  });

  vendorSelect.addEventListener('change', () => { saveVendor(vendorSelect.value); render(); });
  brandFilter.addEventListener('change', render);
  searchBox.addEventListener('input', render);

  buildSpectrum();
  buildVendorOptions();
  buildBrandOptions();
  render();
</script>
</body>
</html>
