# 정적 대시보드 nginx 설정 (비루트 nginx-unprivileged, 8080 포트)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅 fallback (새로고침 시 404 방지)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Coolify Health Check Path: /healthz (DB/외부 의존성 없이 항상 200)
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # 정적 자산 장기 캐시 (Vite 가 해시 파일명 부여)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
